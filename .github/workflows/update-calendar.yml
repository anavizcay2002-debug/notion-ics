name: Update Notion Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate calendar
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: python generate_calendar.py

      - name: Generate sync status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          ics = Path("calendar.ics").read_text(encoding="utf-8")
          events = ics.count("BEGIN:VEVENT")
          status = {
              "status": "ok",
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "events": events,
              "interval_minutes": 5
          }
          Path("status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Prepare Pages files
        run: |
          mkdir public
          cp calendar.ics public/calendar.ics
          cp index.html public/index.html
          cp status.json public/status.json

      - name: Upload calendar to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
