<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Calendar Sync</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 60px 24px; line-height: 1.6; color: #222; }
    .card { padding: 32px; border: 1px solid #ddd; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    h1 { margin-top: 0; }
    a.button { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #222; color: white; text-decoration: none; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📅 Notion Calendar Sync</h1>
    <p>Tu calendario de Notion se genera automáticamente y se actualiza cada 5 minutos.</p>
    <p><a class="button" href="calendar.ics">Descargar calendario</a></p>
    <p><strong>URL de suscripción:</strong><br><code id="url"></code></p>
  </div>
  <script>
    document.getElementById('url').textContent = new URL('calendar.ics', window.location.href).href;
  </script>
</body>
</html>
